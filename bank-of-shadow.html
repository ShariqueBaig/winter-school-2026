<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank of Shadow | Secure Login</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #e6edf3;
            --accent: #238636;
            --error: #da3633;
            --card-bg: #161b22;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            /* Removed fixed width to allow specific IDs to set it */
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #30363d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        #login-view {
            width: 400px;
        }

        #dashboard-view {
            width: 900px;
            max-width: 95%;
            /* Responsive on small screens */
            display: none;
            /* Hide by default so it doesn't overlap login */
        }

        .glitch-wrapper {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            color: var(--text-color);
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #8b949e;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: var(--text-color);
            font-family: monospace;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--accent);
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 6px;
            display: none;
            font-size: 0.9rem;
        }

        .result.success {
            background: rgba(35, 134, 54, 0.2);
            border: 1px solid var(--accent);
            color: #7ee787;
        }

        .result.error {
            background: rgba(218, 54, 51, 0.2);
            border: 1px solid var(--error);
            color: #ff7b72;
        }

        /* Dashboard View (Hidden by default) */
        #dashboard-view {
            display: none;
        }

        .balance-card {
            background: rgba(35, 134, 54, 0.1);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .balance {
            font-size: 2rem;
            font-weight: bold;
            color: #7ee787;
        }

        .history {
            margin-top: 2rem;
            border-top: 1px solid #30363d;
            padding-top: 1rem;
        }

        .history-item {
            padding: 0.5rem;
            border-bottom: 1px solid #30363d;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        input.vulnerable {
            border-color: #d29922;
        }

        /* Top Right User Badge - Fixed to Viewport */
        .user-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(48, 54, 61, 0.9);
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid #30363d;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>

    <!-- LOGIN SCREEN -->
    <div class="container" id="login-view">
        <div class="glitch-wrapper">
            <h1>🏦 Bank of Shadow</h1>
            <p style="font-size: 0.8rem; color: #8b949e;">Authorized Personnel Only</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="admin" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="off">
            </div>
            <button type="submit">SECURE LOGIN</button>
        </form>

        <div id="login-result" class="result"></div>
        <p style="margin-top:20px; font-size: 0.7rem; color: #484f58; text-align: center;">System Version: v1.0.4
            (Patched? No.)</p>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div class="container" id="dashboard-view">
        <!-- USER BADGE MOVED TO BODY (VISUALLY) BUT KEPT IN MARKDOWN FLOW? NO, FIXED POSITION -->
        <div class="user-badge">
            <div class="user-avatar">A</div>
            <span>Logged in as: <strong id="current-user-display">ADMIN</strong></span>
        </div>

        <div class="glitch-wrapper">
            <h1>👋 Welcome Back</h1>
            <p style="font-size: 0.8rem; color: #7ee787;">Access Level: SUPERUSER</p>
        </div>

        <div class="balance-card">
            <div>Current Balance</div>
            <div class="balance">$9,999,999.00</div>
        </div>

        <!-- LEVEL 2 & 4: TRANSFER & SEARCH -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Quick Transfer</label>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="number" id="amount" class="vulnerable" placeholder="Amount ($)" style="width: 40%;">
                    <input type="text" id="memo" class="vulnerable" placeholder="Memo" autocomplete="off">
                </div>
                <button onclick="submitTransfer()" style="margin-top: 5px;">SEND FUNDS</button>
            </div>
            <div class="form-group">
                <label>User Search</label>
                <input type="text" id="user-search" class="vulnerable" placeholder="Search User" autocomplete="off">
                <button onclick="searchUser()" style="margin-top: 10px; background: #8957e5;">SEARCH DB</button>
            </div>
        </div>
        <div class="form-group">
            <label>Loan Status</label>
            <input type="text" id="loan-id" class="vulnerable" placeholder="Loan ID" autocomplete="off">
            <button onclick="checkLoan()" style="margin-top: 10px; background: #8957e5;">CHECK STATUS</button>
            <div id="loan-result" class="result" style="margin-top: 10px;"></div>
        </div>
        <div class="form-group">
            <label>Support Ticket</label>
            <input type="text" id="ticket-msg" class="vulnerable" placeholder="Message" autocomplete="off">
            <button onclick="submitTicket()" style="margin-top: 10px;">SUBMIT TICKET</button>
            <div id="ticket-result" class="result" style="margin-top: 10px;"></div>
        </div>

        <!-- DECOY FIELDS (SECURE) -->
        <div
            style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; border-top: 1px dashed #30363d; padding-top: 20px;">
            <div class="form-group">
                <label style="color: #7ee787;">Transaction Verifier (Secure)</label>
                <input type="text" id="verify-id" placeholder="Enter TX ID (e.g. TX-99)" autocomplete="off">
                <button onclick="verifyTx()" style="margin-top: 10px; background: #238636;">VERIFY</button>
                <div id="verify-result" class="result" style="margin-top: 10px;"></div>
            </div>
            <div class="form-group">
                <label style="color: #7ee787;">Newsletter Signup (Secure)</label>
                <input type="email" id="newsletter-email" placeholder="Enter Email" autocomplete="off">
                <button onclick="signupNewsletter()" style="margin-top: 10px; background: #238636;">SUBSCRIBE</button>
                <div id="newsletter-result" class="result" style="margin-top: 10px;"></div>
            </div>
        </div>

        <!-- LEVEL 3: STORED XSS -->
        <div class="form-group" style="margin-top: 20px; border-top: 1px solid #30363d; padding-top: 20px;">
            <label>Update Profile Bio</label>
            <textarea id="profile-bio" rows="3"
                style="width: 100%; background: #0d1117; border: 1px solid #d29922; color: white; padding: 10px;"
                placeholder="Bio visible to everyone..."></textarea>
            <button onclick="saveBio()" style="margin-top: 10px; background: #d29922;">SAVE BIO</button>
        </div>
        <div id="bio-display"
            style="padding: 10px; background: rgba(210, 153, 34, 0.1); border-left: 3px solid #d29922; margin-top: 10px; display: none;">
            <!-- Bio content injected here -->
        </div>



        <!-- OUTPUT AREAS -->
        <div id="search-results" class="result" style="display: none;"></div>

        <div class="history">
            <h4 style="margin: 0 0 10px 0;">Transaction History</h4>
            <div id="tx-history">
                <div class="history-item">
                    <span>Payment to Shadow Syndicate</span>
                    <span style="color: #da3633;">-$50,000</span>
                </div>
            </div>
        </div>

        <button onclick="logout()" style="margin-top: 20px; background: #30363d;">LOGOUT</button>
    </div>

    <script>
        // ==========================================
        // VULNERABILITY SIMULATION
        // ==========================================

        const loginForm = document.getElementById('login-form');
        const loginResult = document.getElementById('login-result');

        // Check for Session & Stored XSS on Load
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Session Persistence
            const currentUser = localStorage.getItem('shadow_user');
            if (currentUser) {
                // Skip Login
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('dashboard-view').style.display = 'block';

                // Update Badge
                let displayUser = currentUser;
                if (currentUser === "admin" || currentUser.includes("' OR")) displayUser = "ADMIN";
                document.getElementById('current-user-display').textContent = displayUser.toUpperCase();
            }

            // 2. Stored XSS Check
            const storedBio = localStorage.getItem('shadow_bio');
            if (storedBio) {
                const bioDisplay = document.getElementById('bio-display');
                bioDisplay.style.display = 'block';
                // VULNERABILITY: Stored XSS (innerHTML)
                bioDisplay.innerHTML = "<strong>Your Bio:</strong><br>" + storedBio;

                // FORCE SCRIPT EXECUTION FOR SIMULATION
                // Browsers don't run <script> in innerHTML by default. We simulate a dumb server that does.
                executeScripts(bioDisplay);
            }
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // 1. LOGIN SQL INJECTION
            const sqliPatterns = ["' OR 1=1", "' OR '1'='1", "admin' --", "' OR true"];

            if ((user === 'admin' && pass === 'shadow123') ||
                sqliPatterns.some(p => user.includes(p) || pass.includes(p))) {

                // Save Session
                localStorage.setItem('shadow_user', user);

                // Update UI
                let displayUser = user;
                if (sqliPatterns.some(p => user.includes(p))) displayUser = "ADMIN";
                if (user === "admin") displayUser = "ADMIN";
                document.getElementById('current-user-display').textContent = displayUser.toUpperCase();

                loginSuccess();
            } else {
                loginFail("Invalid credentials. Try harder.");
            }
        });

        function loginSuccess() {
            loginResult.style.display = 'block';
            loginResult.className = 'result success';
            loginResult.innerHTML = '🔓 <strong>ACCESS GRANTED</strong><br>Redirecting to secure dashboard...';

            setTimeout(() => {
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('dashboard-view').style.display = 'block';
            }, 1000);
        }

        function loginFail(msg) {
            loginResult.style.display = 'block';
            loginResult.className = 'result error';
            loginResult.innerHTML = '❌ <strong>ACCESS DENIED</strong><br>' + msg;
            shakeContainer();
        }

        // 2. REFLECTED XSS (Transfer)
        function submitTransfer() {
            const memoInput = document.getElementById('memo').value;
            const amountInput = document.getElementById('amount').value; // Get raw string
            const history = document.getElementById('tx-history');
            const balanceEl = document.querySelector('.balance');

            // LOGIC FLAW: No validation on Amount!
            // If amount is empty string "", parseFloat("") is NaN.
            // Balance becomes NaN. This teaches "Boundary Checking".
            let currentBal = parseFloat(balanceEl.innerText.replace('$', '').replace(/,/g, ''));
            let transAmount = parseFloat(amountInput);

            // Allow NaN to propagate to show the bug!
            let newBal = currentBal - transAmount;
            balanceEl.innerText = '$' + newBal.toLocaleString(undefined, { minimumFractionDigits: 2 });

            // Create new transaction entry
            const newItem = document.createElement('div');
            newItem.className = 'history-item';

            // VULNERABILITY: Reflected XSS
            newItem.innerHTML = `
                <span>Transfer: ${memoInput}</span>
                <span style="color: #da3633;">-$${amountInput}</span>
            `;

            history.prepend(newItem);

            // Force Script Execution for Simulation
            executeScripts(newItem);
        }

        // Helper to manually run scripts (simulating a completely vulnerable render)
        function executeScripts(element) {
            const scripts = element.getElementsByTagName("script");
            for (let i = 0; i < scripts.length; i++) {
                const newScript = document.createElement("script");
                newScript.text = scripts[i].text;
                document.body.appendChild(newScript); // Execute immediately
                document.body.removeChild(newScript); // Cleanup
            }
        }

        // 3. STORED XSS (Profile Bio)
        function saveBio() {
            const bio = document.getElementById('profile-bio').value;
            localStorage.setItem('shadow_bio', bio);
            alert("Bio Saved! Reloading to apply changes...");
            location.reload();
        }

        // 4. BLIND/UNION SQL INJECTION (User Search)
        function searchUser() {
            const query = document.getElementById('user-search').value.toLowerCase().trim();
            const resultBox = document.getElementById('search-results');

            // Database Mockup
            const users = [
                { id: 101, user: 'abdullah_dev', role: 'intern' },
                { id: 102, user: 'zainab_manager', role: 'admin_assistant' },
                { id: 103, user: 'anas_tech', role: 'developer' },
                { id: 104, user: 'fatima_hr', role: 'recruiter' },
                { id: 105, user: 'hamza_blackhat', role: 'flagged_user' }
            ];

            // Hidden Admin Table
            const adminTable = [
                { user: 'SUPER_ADMIN', pass: 'FLAG{SHADOW_MASTER_KEY_2026}' }
            ];

            // VULNERABILITY: UNION SELECT Simulation
            if (query.includes('union select')) {
                // If they try to selecting columns...
                resultBox.style.display = 'block';
                resultBox.className = 'result success';
                resultBox.innerHTML = `
                    <strong>DATABASE DUMP:</strong><br>
                    Row 1: ${adminTable[0].user} | ${adminTable[0].pass}<br>
                    <span style="font-size:0.8em; color:#8b949e;">(2 columns returned)</span>
                `;
            } else {
                // Normal search (Partial Match Fix)
                const found = users.find(u => u.user.toLowerCase().includes(query));

                resultBox.style.display = 'block';
                if (found) {
                    resultBox.className = 'result';
                    resultBox.innerHTML = `Found: ID ${found.id} | User: ${found.user} | Role: ${found.role}`;
                } else {
                    resultBox.className = 'result error';
                    resultBox.innerHTML = 'User not found.';
                }
            }
        }

        // 5. BLIND SQL INJECTION (Loan Status)
        function checkLoan() {
            const input = document.getElementById('loan-id').value.trim(); // Case sensitive for the string parts
            const upperInput = input.toUpperCase();
            const result = document.getElementById('loan-result');

            // Logic: 1001 is Approved. 
            // Mock Data: Database Name = 'shadow_bank' (Length: 11)

            let isTrue = false;
            let isValidBase = input.includes('1001');

            if (isValidBase) {
                // 1. Base Case
                if (input === '1001') isTrue = true;

                // 2. Boolean Logic
                if (upperInput.includes('AND 1=1')) isTrue = true;
                if (upperInput.includes('AND 1=2')) isTrue = false;

                // 3. Database Enumeration Simulation
                // Check Length: AND length(database())=11
                const lenMatch = upperInput.match(/LENGTH\(DATABASE\(\)\)=(\d+)/);
                if (lenMatch) {
                    if (lenMatch[1] === '11') isTrue = true;
                    else isTrue = false;
                }

                // Check Name (Full): AND database()='shadow_bank'
                const nameMatch = input.match(/database\(\)='([^']+)'/i);
                if (nameMatch) {
                    if (nameMatch[1] === 'shadow_bank') isTrue = true;
                    else isTrue = false;
                }

                // Check Name (Character-by-Character): AND substring(database(),1,1)='s'
                // Regex matches: substring(database(), INDEX, 1) = 'CHAR'
                const subMatch = input.match(/substring\(database\(\),(\d+),1\)='([^'])'/i);
                if (subMatch) {
                    const index = parseInt(subMatch[1]); // 1-based index
                    const char = subMatch[2]; // The character to guess
                    const dbName = 'shadow_bank';

                    // SQL substring is 1-based
                    if (index > 0 && index <= dbName.length) {
                        if (dbName[index - 1] === char) isTrue = true;
                        else isTrue = false;
                    }
                }
            }

            result.style.display = 'block';
            if (isTrue) {
                result.className = 'result success';
                result.innerHTML = "✅ Loan #1001: <strong>APPROVED</strong>";
            } else {
                result.className = 'result error';
                result.innerHTML = "❌ Loan Status: <strong>NOT FOUND / PENDING</strong>";
            }
        }

        // 6. FILTERED XSS (WAF Bypass)
        function submitTicket() {
            const msg = document.getElementById('ticket-msg').value;
            const result = document.getElementById('ticket-result');

            // SIMULATED WAF (Web Application Firewall)
            // Blocks: script, alert, onerror
            const blacklist = ['script', 'alert', 'onerror'];

            if (blacklist.some(word => msg.toLowerCase().includes(word))) {
                result.style.display = 'block';
                result.className = 'result error';
                result.innerHTML = "🛡️ <strong>WAF BLOCK:</strong> Malicious content detected.";
                shakeContainer();
                return;
            }

            // If bypass successful (e.g., <svg onload=confirm(1)> or <img src=x onmouseover=prompt(1)>)
            result.style.display = 'block';
            result.className = 'result success';
            result.innerHTML = `Ticket Sent: ${msg}`; // Reflected XSS

            // Force execution of scripts (even if obscured)
            executeScripts(result);

            // Manually trigger inline handlers for the simulation since innerHTML doesn't fire them automatically
            // This is a "helper" to make the simulation act like a real browser vulnerability
            const elements = result.querySelectorAll('*');
            elements.forEach(el => {
                // Check all attributes for on... handlers and execute them
                for (let i = 0; i < el.attributes.length; i++) {
                    if (el.attributes[i].name.startsWith('on')) {
                        try { eval(el.attributes[i].value); } catch (e) { }
                    }
                }
            });
        }

        function shakeContainer() {
            const container = document.querySelector('.container');
            container.style.transform = 'translateX(10px)';
            setTimeout(() => container.style.transform = 'translateX(-10px)', 100);
            setTimeout(() => container.style.transform = 'translateX(10px)', 200);
            setTimeout(() => container.style.transform = 'translateX(0)', 300);
        }

        // ==========================================
        // DECOY FUNCTIONS (SECURE)
        // ==========================================

        // Decoy 1: Transaction Verifier (Secure against SQLi/XSS)
        function verifyTx() {
            const txId = document.getElementById('verify-id').value;
            const result = document.getElementById('verify-result');

            // SECURE: Uses simple strict equality and returns static text or safe textContent
            result.style.display = 'block';
            if (txId === 'TX-99') {
                result.className = 'result success';
                result.textContent = "Verified: Valid Transaction from 2024."; // Safe
            } else {
                result.className = 'result error';
                // SECURE: textContent prevents HTML injection (XSS)
                result.textContent = `Error: Transaction '${txId}' not found in public ledger.`;
            }
        }

        // Decoy 2: Newsletter (Secure against XSS)
        function signupNewsletter() {
            const email = document.getElementById('newsletter-email').value;
            const result = document.getElementById('newsletter-result');

            if (!email.includes('@')) {
                result.style.display = 'block';
                result.className = 'result error';
                result.textContent = "Invalid email address.";
                return;
            }

            result.style.display = 'block';
            result.className = 'result success';
            // SECURE: textContent again. Even if they type <script>, it renders as text.
            result.textContent = `Thanks! Subscribed: ${email}`;
        }

        function logout() {
            localStorage.removeItem('shadow_bio');
            localStorage.removeItem('shadow_user'); // Clear session
            location.reload();
        }
    </script>
</body>
